<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 모바일 화면에 맞추고, 아이폰 노치 영역까지 화면을 쓰도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>옷사진 스튜디오</title>

  <!-- PWA(홈 화면 설치) 설정 -->
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="옷사진 스튜디오">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- 한글 글꼴(Pretendard). 불러오지 못하면 기기 기본 글꼴을 사용 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">옷사진 스튜디오</h1>
  </header>

  <!-- 각 화면의 내용이 여기에 그려집니다 (js/app.js의 render 함수) -->
  <main id="view" tabindex="-1"></main>

  <!-- 하단 탭 메뉴: 주소 끝의 #이름으로 화면을 바꿉니다 -->
  <nav class="tabbar" aria-label="화면 이동">
    <a href="#upload" data-route="upload">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
      사진
    </a>
    <a href="#background" data-route="background">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      배경
    </a>
    <a href="#result" data-route="result">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
      결과
    </a>
    <a href="#library" data-route="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      내 배경
    </a>
  </nav>

  <!-- 짧은 알림 메시지 -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
